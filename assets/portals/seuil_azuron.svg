    <path d="M72 346h176l12 13-15 13H75l-15-13 12-13Z" fill="#05162f" stroke="#0ea5e9"/>
    <path d="M101 359h118" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" filter="url(#azuron-glow)"/>
    <circle cx="79" cy="359" r="6" fill="#22d3ee"/>
    <circle cx="241" cy="359" r="6" fill="#22d3ee"/>
  </g>
