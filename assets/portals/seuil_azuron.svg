    <path d="M160 68c64 0 101 60 101 143v111" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <path d="M79 322h162" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
  </g>

