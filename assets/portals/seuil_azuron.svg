<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="title desc">
  <title id="title">Le Seuil d'Azuron</title>
  <desc id="desc">Une arche blindée cobalt gardée par deux sentinelles et traversée par une énergie cyan.</desc>
  <defs>
    <linearGradient id="azuron-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cc9ff"/>
      <stop offset=".16" stop-color="#183c6b"/>
      <stop offset=".52" stop-color="#07172f"/>
      <stop offset=".82" stop-color="#1d4e82"/>
      <stop offset="1" stop-color="#a7d8ff"/>
    </linearGradient>
    <linearGradient id="azuron-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a68"/>
      <stop offset=".48" stop-color="#06152c"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <radialGradient id="azuron-energy" cx="50%" cy="43%" r="62%">
      <stop offset="0" stop-color="#04152d"/>
      <stop offset=".35" stop-color="#075ea9"/>
      <stop offset=".69" stop-color="#09d9ff"/>
      <stop offset=".82" stop-color="#52f4ff"/>
      <stop offset="1" stop-color="#b9fbff"/>
    </radialGradient>
    <radialGradient id="azuron-halo" cx="50%" cy="43%" r="58%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".42"/>
      <stop offset=".58" stop-color="#0ea5e9" stop-opacity=".14"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="azuron-grid" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0h18v18H0z" fill="none" stroke="#67e8f9" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <filter id="azuron-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="azuron-soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="azuron-threshold">
      <path d="M160 71C93 71 61 129 61 209v99h198v-99c0-80-32-138-99-138Z"/>
    </clipPath>
  </defs>

  <ellipse cx="160" cy="214" rx="151" ry="190" fill="url(#azuron-halo)"/>
  <ellipse cx="160" cy="366" rx="122" ry="24" fill="#020817" opacity=".88"/>
  <ellipse cx="160" cy="360" rx="94" ry="15" fill="#22d3ee" opacity=".18" filter="url(#azuron-soft-glow)"/>

  <g clip-path="url(#azuron-threshold)">
    <path d="M160 79C101 79 72 132 72 211v89h176v-89c0-79-29-132-88-132Z" fill="url(#azuron-energy)"/>
    <path d="M60 70h200v240H60z" fill="url(#azuron-grid)" opacity=".82"/>
    <path d="M160 91C112 91 86 137 86 210v77h148v-77c0-73-26-119-74-119Z" fill="#03142d" opacity=".39"/>
    <path d="M94 286c23-24 42-35 66-35s43 11 66 35" fill="none" stroke="#9ff9ff" stroke-opacity=".65" stroke-width="2"/>
    <g fill="none" stroke="#d9fdff" stroke-linecap="round" filter="url(#azuron-glow)">
