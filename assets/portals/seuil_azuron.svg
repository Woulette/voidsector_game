    <path d="M58 109 30 143v179l34 28 24-35V157l-30-48Z"/>
    <path d="m262 109 28 34v179l-34 28-24-35V157l30-48Z"/>
    <path d="m83 51 36-26h82l36 26-28 33h-98L83 51Z"/>
  </g>

  <g fill="url(#azuron-dark)" stroke="#38bdf8" stroke-width="1.5">
    <path d="m43 158 20-21 14 25v55l-34 20v-79Z"/>
