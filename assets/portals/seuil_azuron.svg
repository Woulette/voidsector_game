    <g transform="translate(59 188)">
      <path d="m0-27 18 11v31L0 29-18 15v-31L0-27Z" fill="#061a36" stroke="#7dd3fc" stroke-width="2"/>
      <path d="m0-17 9 11-9 16-9-16 9-11Z" fill="#67e8f9" filter="url(#azuron-glow)"/>
      <path d="M-10 16 0 24l10-8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    </g>
    <g transform="translate(261 188)">
      <path d="m0-27 18 11v31L0 29-18 15v-31L0-27Z" fill="#061a36" stroke="#7dd3fc" stroke-width="2"/>
      <path d="m0-17 9 11-9 16-9-16 9-11Z" fill="#67e8f9" filter="url(#azuron-glow)"/>
      <path d="M-10 16 0 24l10-8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    </g>
  </g>

  <g transform="translate(160 49)">
    <path d="M0-21 24-10v18C24 24 13 36 0 43-13 36-24 24-24 8v-18L0-21Z" fill="#071b38" stroke="#a5f3fc" stroke-width="2"/>
    <path d="M0-11 13-5v11c0 9-5 16-13 22C-8 22-13 15-13 6V-5L0-11Z" fill="none" stroke="#22d3ee" stroke-width="3" filter="url(#azuron-glow)"/>
