      <path d="M80 200c7-29 21-47 43-59M240 200c-7-29-21-47-43-59" stroke-width="2" opacity=".52"/>
      <path d="M103 255c14-12 33-18 57-18s43 6 57 18" stroke-width="2" opacity=".58"/>
    </g>
  </g>

  <g fill="url(#azuron-metal)" stroke="#77ddff" stroke-width="2">
